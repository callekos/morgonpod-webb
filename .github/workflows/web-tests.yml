name: Web acceptance
on:
  push:
    branches: [main]
    paths-ignore: ['catalog/**', 'episodes/**', 'episodes.json', 'story_index.json', 'coverage*.json', 'stats.json']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --test tests/*.test.cjs
  browsers:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Kontrollera att installerad Playwright matchar containerbilden
        run: node -e "if(require('@playwright/test/package.json').version!=='1.56.1')throw Error('Playwright image/package mismatch')"
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          retention-days: 7
          path: |
            playwright-report/
            docs/evidence/
  published:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, browsers]
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-live.cjs
      - run: npm install --ignore-scripts
      - name: Kontrollera att installerad Playwright matchar containerbilden
        run: node -e "if(require('@playwright/test/package.json').version!=='1.56.1')throw Error('Playwright image/package mismatch')"
      - run: npm run test:browser
        env:
          MORGONPOD_TEST_URL: https://callekos.github.io/morgonpod-webb/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-browser-evidence
          retention-days: 7
          path: |
            playwright-report/
            docs/evidence/



<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="theme-color" content="#111917"><title>Statistik | Morgonpod</title><link rel="stylesheet" href="morgonpod-ui-v6.css"></head><body class="news-layout"><header class="news-header"><a class="news-brand" href="idag.html">Morgonpod</a></header><main class="news-main"><h1>Statistik</h1><p class="news-lead">Öppen statistikvy, inte länkad från webbplatsens meny.</p><div id="report"><p>Hämtar publicerad statistik…</p></div></main><script>const root=document.getElementById('report');const safe=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;'}[c]));fetch('stats.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('missing');return r.json()}).then(data=>{const episodes=(data.episodes||[]).filter(x=>Number.isFinite(x.listens)).sort((a,b)=>b.listens-a.listens);const articles=(data.articles||[]).filter(x=>Number.isFinite(x.views)).sort((a,b)=>b.views-a.views);root.innerHTML='<div class="stat-cards"><div><strong>'+episodes.reduce((n,x)=>n+x.listens,0).toLocaleString('sv-SE')+'</strong><span>Registrerade lyssningar</span></div><div><strong>'+articles.reduce((n,x)=>n+x.views,0).toLocaleString('sv-SE')+'</strong><span>Artikelvisningar</span></div></div><h2>Mest lyssnade poddavsnitt</h2>'+episodes.slice(0,100).map(x=>'<p>'+safe(x.title||x.id)+' · '+x.listens.toLocaleString('sv-SE')+'</p>').join('')+'<h2>Mest lästa artiklar</h2>'+articles.slice(0,100).map(x=>'<p>'+safe(x.title||x.id)+' · '+x.views.toLocaleString('sv-SE')+'</p>').join('')}).catch(()=>{root.innerHTML='<p>Ingen verifierad lyssnings- eller visningsstatistik har publicerats ännu. Räknaren behöver anslutas innan siffror kan visas.</p>'});</script></body></html>
